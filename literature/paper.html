<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Notes - Bigyan</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#1e40af',
                        secondary: '#64748b',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    }
                }
            }
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="research.css">
    
    <!-- Load marked.js for client-side markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="academic-page bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-300 pt-16">
    
    <!-- Navigation (matching portfolio homepage) -->
    <nav id="navbar" class="fixed top-0 w-full bg-white/80 dark:bg-gray-900/80 backdrop-blur-md z-50 border-b border-gray-200 dark:border-gray-800 transition-all duration-300">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <a href="../index.html" class="text-xl font-semibold text-gray-900 dark:text-gray-100">Bigyan</a>
                
                <div class="hidden md:flex items-center space-x-8">
                    <a href="../index.html#about" class="nav-link text-gray-900 dark:text-gray-100 hover:text-primary dark:hover:text-blue-400 transition-colors">About</a>
                    <a href="../index.html#projects" class="nav-link text-gray-900 dark:text-gray-100 hover:text-primary dark:hover:text-blue-400 transition-colors">Projects</a>
                    <a href="index.html" class="nav-link text-primary dark:text-blue-400 transition-colors font-medium">Literature</a>
                    <a href="../index.html#experience" class="nav-link text-gray-900 dark:text-gray-100 hover:text-primary dark:hover:text-blue-400 transition-colors">Experience</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="content px-4 py-12 lg:px-8 max-w-4xl mx-auto">
        <div class="mb-10">
            <a href="index.html" class="text-primary dark:text-blue-400 font-medium hover:underline flex items-center font-['Inter'] text-sm">
                <span class="mr-2">&larr;</span> Back to Literature Index
            </a>
        </div>
        
        <div id="paper-container" class="reading-container">
            <p>Loading...</p>
        </div>
    </main>

    <script src="papers.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const fileName = urlParams.get('file');
            const container = document.getElementById('paper-container');

            if (!fileName) {
                container.innerHTML = '<h1>Error</h1><p>No paper specified.</p>';
                return;
            }
            
            const paperData = papersData.find(p => p.file === fileName);

            fetch(fileName)
                .then(response => {
                    if (!response.ok) throw new Error('File not found');
                    return response.text();
                })
                .then(text => {
                    // Strip the YAML frontmatter entirely before rendering
                    const strippedText = text.replace(/^---\s*[\s\S]*?---\s*/, '');
                    
                    let htmlContent = '';
                    
                    if (paperData) {
                        document.title = paperData.title + " - Bigyan";
                        const authorsStr = paperData.authors ? paperData.authors.join(', ') : '';
                        const link = paperData.url || paperData.arxiv_url;
                        const linkHtml = link ? `<div class="mt-4"><a href="${link}" target="_blank" class="text-primary dark:text-blue-400 hover:underline font-medium inline-flex items-center text-sm">View Original Paper <span class="ml-1">&#8599;</span></a></div>` : '';
                        
                        htmlContent += `
                            <div class="mb-12 border-b border-gray-200 dark:border-gray-800 pb-8">
                                <h1 class="text-3xl md:text-4xl font-bold font-['Inter'] text-gray-900 dark:text-gray-100 mb-6 leading-tight">${paperData.title}</h1>
                                
                                <div class="font-['Inter'] space-y-2 text-sm md:text-base">
                                    <div class="flex gap-2">
                                        <span class="text-gray-500 font-semibold w-20">Authors:</span>
                                        <span class="text-gray-800 dark:text-gray-200 font-medium flex-1">${authorsStr}</span>
                                    </div>
                                    <div class="flex gap-2">
                                        <span class="text-gray-500 font-semibold w-20">Venue:</span>
                                        <span class="text-gray-700 dark:text-gray-300 flex-1">${paperData.venue} (${paperData.year})</span>
                                    </div>
                                    ${linkHtml}
                                </div>
                            </div>
                            <div class="prose prose-lg dark:prose-invert max-w-none text-gray-800 dark:text-gray-200">
                        `;
                    }
                    
                    // Render the markdown content
                    htmlContent += marked.parse(strippedText);
                    if(paperData){
                        htmlContent += `</div>`;
                    }
                    container.innerHTML = htmlContent;
                })
                .catch(err => {
                    container.innerHTML = `<h1 class="text-2xl font-bold mb-4">Error</h1><p class="text-red-500">Could not load ${fileName}.</p><p class="text-sm text-gray-500 mt-2">${err}</p>`;
                });
        });
    </script>
</body>
</html>
